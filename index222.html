<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Alimentare — Calendario</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap');
  :root {
    --bg:#faf7f2;--surface:#fff;--ink:#1a1208;--muted:#7a6e5f;
    --accent:#c8522a;--accent2:#4a7c59;--gold:#d4a843;--border:#e8e0d4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  header{background:var(--ink);color:var(--bg);padding:28px 48px;display:flex;align-items:center;justify-content:space-between;}
  header h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;letter-spacing:-0.02em;}
  header span{font-size:0.8rem;text-transform:uppercase;letter-spacing:0.15em;color:var(--gold);font-weight:500;}
  .container{max-width:1100px;margin:0 auto;padding:40px 32px;}

  .year-nav{display:flex;align-items:center;gap:20px;margin-bottom:40px;}
  .year-nav button{background:none;border:1px solid var(--border);padding:8px 18px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.9rem;transition:all 0.15s;}
  .year-nav button:hover{background:var(--ink);color:white;border-color:var(--ink);}
  .year-title{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;}

  .stats-bar{display:flex;gap:24px;margin-bottom:36px;flex-wrap:wrap;}
  .stat{background:var(--surface);border:1px solid var(--border);padding:14px 22px;}
  .stat-n{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--accent);}
  .stat-l{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-top:2px;}

  .months-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}

  .month-block{background:var(--surface);border:1px solid var(--border);}
  .month-title{background:var(--ink);color:var(--bg);padding:10px 16px;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.12em;font-weight:600;}

  .weeks-list{padding:10px 0;}
  .week-row{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s;position:relative;}
  .week-row:last-child{border-bottom:none;}
  .week-row:hover{background:#f5f0e8;}
  .week-row.has-plan{background:#f0f7f2;}
  .week-row.has-plan:hover{background:#e4f0e9;}
  .week-row.current-week{outline:2px solid var(--gold);outline-offset:-2px;}

  .week-num{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-weight:600;width:36px;text-align:center;padding:10px 0;flex-shrink:0;}
  .week-dates{flex:1;padding:10px 12px 10px 4px;}
  .week-date-range{font-size:0.78rem;font-weight:500;line-height:1.3;}
  .week-preview{font-size:0.65rem;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
  .week-badge{width:8px;height:8px;border-radius:50%;background:var(--accent2);flex-shrink:0;margin-right:12px;opacity:0;}
  .week-row.has-plan .week-badge{opacity:1;}
  .week-arrow{color:var(--muted);font-size:0.8rem;margin-right:12px;opacity:0;transition:opacity 0.15s;}
  .week-row:hover .week-arrow{opacity:1;}

  @media(max-width:900px){
    .months-grid{grid-template-columns:repeat(2,1fr);}
    header{padding:20px 24px;}
    .container{padding:24px 16px;}
  }
  @media(max-width:600px){
    .months-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>🍽 Piano Alimentare</h1>
    <span>Calendario annuale</span>
  </div>
</header>

<div class="container">
  <div class="year-nav">
    <button onclick="changeYear(-1)">← Anno precedente</button>
    <div class="year-title" id="yearTitle"></div>
    <button onclick="changeYear(1)">Anno successivo →</button>
  </div>

  <div class="stats-bar" id="statsBar"></div>
  <div class="months-grid" id="monthsGrid"></div>
</div>

<script>
const MONTHS_IT = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
let currentYear = new Date().getFullYear();

// Calcola la chiave della settimana ISO per un lunedì
function weekKey(monday) {
  return monday.toISOString().split('T')[0]; // "YYYY-MM-DD" del lunedì
}

// Tutte le 52 settimane che iniziano in quell'anno o che coprono giorni di quell'anno
function getWeeksOfYear(year) {
  const weeks = [];
  // Trova il primo lunedì che rientra nell'anno (anche se inizia a dicembre dell'anno prec.)
  const jan1 = new Date(year, 0, 1);
  const dayOfWeek = jan1.getDay(); // 0=dom,1=lun,...
  const daysToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
  const firstMonday = new Date(jan1);
  firstMonday.setDate(jan1.getDate() + daysToMonday);

  let monday = new Date(firstMonday);
  while (true) {
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    // Includi se la settimana ha almeno un giorno nell'anno
    if (monday.getFullYear() > year && monday.getMonth() > 0) break;
    if (sunday.getFullYear() < year) { monday.setDate(monday.getDate()+7); continue; }
    if (monday.getFullYear() > year) break;
    weeks.push({ monday: new Date(monday), sunday: new Date(sunday) });
    monday.setDate(monday.getDate() + 7);
    if (weeks.length > 53) break;
  }
  return weeks;
}

function formatDate(d) {
  return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' });
}

function loadPlan(key) {
  try { return JSON.parse(localStorage.getItem('piano_' + key)); } catch { return null; }
}

function planPreview(plan) {
  if (!plan) return '';
  const dishes = plan.slice(0,3).map(d => d.pranzo?.name || '').filter(Boolean);
  return dishes.join(' · ');
}

function isCurrentWeek(monday, sunday) {
  const today = new Date();
  today.setHours(0,0,0,0);
  return today >= monday && today <= sunday;
}

function openWeek(key, label) {
  // Apre piano_settimanale.html con la settimana selezionata
  window.location.href = `piano_settimanale.html?week=${encodeURIComponent(key)}&label=${encodeURIComponent(label)}`;
}

function render() {
  document.getElementById('yearTitle').textContent = currentYear;

  const allWeeks = getWeeksOfYear(currentYear);
  const savedCount = allWeeks.filter(w => loadPlan(weekKey(w.monday))).length;
  const currentW = allWeeks.find(w => isCurrentWeek(w.monday, w.sunday));

  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-n">${allWeeks.length}</div><div class="stat-l">Settimane totali</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--accent2)">${savedCount}</div><div class="stat-l">Piani salvati</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--gold)">${allWeeks.length - savedCount}</div><div class="stat-l">Settimane senza piano</div></div>
  `;

  // Raggruppa per mese (mese del lunedì)
  const byMonth = {};
  for (const w of allWeeks) {
    const m = w.monday.getMonth();
    if (!byMonth[m]) byMonth[m] = [];
    byMonth[m].push(w);
  }

  const grid = document.getElementById('monthsGrid');
  grid.innerHTML = '';

  for (let m = 0; m < 12; m++) {
    const weeks = byMonth[m] || [];
    if (!weeks.length) continue;

    const block = document.createElement('div');
    block.className = 'month-block';
    block.innerHTML = `<div class="month-title">${MONTHS_IT[m]} ${currentYear}</div><div class="weeks-list" id="month-${m}"></div>`;
    grid.appendChild(block);

    const list = block.querySelector('.weeks-list');
    weeks.forEach((w, wi) => {
      const key = weekKey(w.monday);
      const plan = loadPlan(key);
      const label = `${formatDate(w.monday)} – ${formatDate(w.sunday)}`;
      const current = isCurrentWeek(w.monday, w.sunday);

      // Numero settimana ISO
      const jan4 = new Date(w.monday.getFullYear(), 0, 4);
      const weekN = Math.ceil(((w.monday - jan4) / 86400000 + jan4.getDay() + 1) / 7);

      const row = document.createElement('div');
      row.className = 'week-row' + (plan ? ' has-plan' : '') + (current ? ' current-week' : '');
      row.innerHTML = `
        <div class="week-num">W${weekN}</div>
        <div class="week-dates">
          <div class="week-date-range">${label}${current ? ' <span style="color:var(--gold);font-size:0.65rem">● oggi</span>' : ''}</div>
          ${plan ? `<div class="week-preview">${planPreview(plan)}</div>` : '<div class="week-preview" style="font-style:italic">Nessun piano</div>'}
        </div>
        <div class="week-badge"></div>
        <div class="week-arrow">→</div>
      `;
      row.onclick = () => openWeek(key, label);
      list.appendChild(row);
    });
  }
}

function changeYear(delta) {
  currentYear += delta;
  render();
  window.scrollTo(0,0);
}

render();

// Scorri alla settimana corrente
setTimeout(() => {
  const cur = document.querySelector('.current-week');
  if (cur) cur.scrollIntoView({ behavior: 'smooth', block: 'center' });
}, 100);
</script>
</body>
</html>
